.math-actions{gap:8px}.formula-card{display:flex;flex-direction:column;gap:8px}.formula-card>span{flex:none;line-height:1.6}.formula-card>div{flex:none;padding:10px 2px;min-height:54px}.math-preview{line-height:1.7}.ink-footer{flex-wrap:wrap}.ink-footer select{min-width:0;max-width:100%}.ink-area p{inset:0;display:flex;align-items:center;justify-content:center;margin:0;padding:16px;line-height:1.6}.status{gap:12px}#save-status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#count{white-space:nowrap;flex:none}

<body>
<header><div class="brand"><div class="mark">◇</div><div><h1 id="title">工程画板</h1><p>自然语言与数学描述 · 每个部位都能关联实现</p></div></div><div class="actions"><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button><span class="divider"></span><button id="import" class="secondary">打开画板</button><button id="export" class="secondary">导出画板</button><button id="toggle-inspector" aria-expanded="false">详情</button><button id="versions">历史版本</button><button id="save" class="primary">保存修改</button></div></header>
<div id="banner"></div>
<main><nav class="tools" aria-label="绘图工具">
<button data-tool="select" aria-pressed="true" title="选择与移动 V"><b>↖</b>选择</button><button data-tool="pan" title="平移 H，也可按住空格"><b>✥</b>平移</button><hr>
<button data-tool="rect" title="拖动绘制矩形 R"><b>▭</b>矩形</button><button data-tool="ellipse" title="拖动绘制椭圆 O"><b>◯</b>椭圆</button><button data-tool="diamond" title="拖动绘制菱形 D"><b>◇</b>菱形</button><button data-tool="polygon" title="逐点绘制，双击或回车完成"><b>⬠</b>多边形</button><button data-tool="pen" title="自由画笔 P"><b>〰</b>画笔</button><button data-tool="line" title="拖动绘制直线 L"><b>╱</b>直线</button><button data-tool="arrow" title="拖动连接两个图形 A"><b>↗</b>箭头</button><hr>
<button data-tool="text" title="点击添加文字 T"><b>T</b>文字</button><button data-tool="math" title="点击添加数学表达 M"><b>∑</b>公式</button><button id="open-formulas" title="浏览与编辑公式"><b>▤</b>公式库</button><button id="open-handwriting" title="识别手写中文和数学公式"><b>✍</b>识别</button><button data-tool="frame" title="拖动绘制分区 F"><b>▣</b>分区</button>
</nav><section class="workspace"><div class="reading-entry"><button id="open-reading">工程导读</button><span>先了解目的，再沿关系查看实现</span><label class="relation-toggle"><input id="all-relation-labels" type="checkbox">全部连线名称</label></div><div class="viewport-note" id="tool-note">拖动图形自由排布 · 点击任意部位查看说明或程序映射</div><svg id="surface" role="application" aria-label="自由工程画板" tabindex="0"><g id="world"></g></svg><div id="empty"><h2>把工程画成你理解的样子</h2><p>画一个形状、写一段说明，或者放下一条数学关系。<br>每个部位都可以关联它的程序表达。</p></div><div class="canvas-footer"><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-value">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">全图</button><button id="readable">阅读大小</button><button id="auto-layout">自动排布</button><label class="relation-toggle"><input id="manual-layout" type="checkbox">自由布局</label></div><div class="guide">空格拖动平移 · 滚轮缩放 · Shift 多选</div></div></section>
<aside><div class="side-head"><small id="selection-kind">画板</small><h2 id="selection-title">选择任意部位</h2><div class="tabs"><button data-tab="reading" aria-pressed="true">工程导读</button><button data-tab="human" aria-pressed="false">说明 · 数学</button><button data-tab="program" aria-pressed="false">程序映射</button></div></div><div class="side-body" id="inspector"></div></aside></main>
<div class="status"><span id="save-status">修改保存在当前浏览器；保存修改后交给 AI 落地</span><span id="count"></span></div><div id="toast" role="status"></div><input id="file-input" type="file" accept="application/json,.json" hidden>
<dialog id="versions-dialog" aria-labelledby="versions-title"><div class="dialog-heading"><h2 id="versions-title">项目保存与历史版本</h2><button id="versions-close">关闭</button></div><p id="version-current" class="hint"></p><label class="field">下一次保存的说明<input id="version-name" placeholder="例如：调整输入校验和数学约束" maxlength="100"></label><label class="field">已保存在项目里的版本<select id="version-list" aria-label="历史保存版本"></select></label><p id="version-state" class="hint" role="status"></p><div class="row"><button id="version-refresh">刷新版本</button><button id="version-choice" class="primary">选定此版本供 AI 读取</button></div></dialog>
<dialog id="export-dialog" aria-labelledby="export-title"><h2 id="export-title">导出画板</h2><p id="export-description" class="hint"></p><p class="hint" id="export-filename"></p><details><summary>查看完整机读内容</summary><textarea id="export-content" aria-label="完整机读内容" readonly></textarea></details><p id="export-feedback" class="hint" role="status"></p><div class="row"><button id="export-close">关闭</button><button id="export-copy">复制完整内容</button><button id="export-download" class="primary">下载文件</button></div></dialog>
<dialog id="formula-dialog" class="wide-dialog" aria-labelledby="formula-title"><div class="dialog-heading"><h2 id="formula-title">数学公式</h2><button id="formula-close">关闭</button></div><p class="hint" id="formula-destination"></p><div class="formula-layout"><section class="formula-browser"><div id="formula-categories" class="formula-categories"></div><div id="formula-templates" class="formula-templates"></div></section><section class="formula-editor"><label for="formula-input">数学表达（支持 LaTeX 数学记法）</label><textarea id="formula-input" spellcheck="false"></textarea><div id="formula-preview" class="math-preview" aria-label="公式预览"></div><p id="formula-feedback" class="hint" role="status"></p><button id="formula-apply" class="primary">确认放入画板</button></section></div><div id="formula-symbols"></div></dialog>
<dialog id="ink-dialog" class="wide-dialog" aria-labelledby="ink-title"><div class="dialog-heading"><h2 id="ink-title">手写识别</h2><button id="ink-close">关闭</button></div><div class="ink-controls"><button id="ink-mode-text" aria-pressed="true">中文说明</button><button id="ink-mode-math" aria-pressed="false">数学公式</button><span class="spacer"></span><button id="ink-undo">撤销一笔</button><button id="ink-clear">清空笔迹</button></div><p id="ink-instructions" class="hint"></p><div class="ink-area"><svg id="ink-pad" viewBox="0 0 1000 420" role="application" aria-label="手写输入区域"><g id="ink-paths"></g></svg><p id="ink-empty">在这里手写中文或数学公式<br>识别后可以修改，再放入画板</p></div><div class="ink-controls"><button id="ink-recognize" class="primary">识别笔迹</button><span id="ink-service" role="status" aria-live="polite">连接本地识别服务…</span><button id="ink-reconnect">重新连接</button></div><p id="ink-feedback" class="hint" role="status"></p><div class="ink-review"><label>识别结果（可以校对）<textarea id="ink-result" spellcheck="false"></textarea></label><div id="ink-result-preview" class="math-preview" aria-label="识别预览"></div></div><p id="ink-result-error" class="hint" role="alert"></p><div class="ink-footer"><select id="ink-destination" aria-label="识别结果放置位置"><option value="new">新增文字或公式图元</option></select><button id="ink-apply" class="primary" disabled>确认放入画板</button></div></dialog>
<script>/*__CLIENT__*/</script>
</body></html>
